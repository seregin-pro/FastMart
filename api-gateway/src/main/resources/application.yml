spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        # Add response header for JWT token forwarding (optional)
        - AddResponseHeader=X-Gateway-Response, FastMart
        # Rate limiting: 100 requests per minute per IP
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      # Route definitions
      routes:
        # Auth routes
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # User routes (consolidated into auth-service)
        - id: user-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        # Product routes
        - id: product-service
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:${PRODUCT_SERVICE_PORT:8082}
          predicates:
            - Path=/api/products/**
            - Path=/api/categories/**
            - Path=/api/manufacturers/**
          filters:
            - StripPrefix=0

        # Cart routes
        - id: cart-service
          uri: http://${CART_SERVICE_HOST:localhost}:${CART_SERVICE_PORT:8083}
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=0

        # Order routes
        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8084}
          predicates:
            - Path=/api/order/**
            - Path=/api/orders/**
          filters:
            - StripPrefix=0

        # Payment routes
        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:${PAYMENT_SERVICE_PORT:8085}
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=0

        # Admin routes
        - id: admin-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

# JWT Secret for token validation
app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-here-change-in-production}
    expiration-in-ms: 86400000
    header: Authorization
    prefix: "Bearer "

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Server
server:
  port: 8080
